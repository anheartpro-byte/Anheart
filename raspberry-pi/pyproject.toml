# AnHeart Raspberry Pi client - tool configuration.
#
# Deliberately NO [project] table. This file exists only to hold tool config in
# one place; it is not a package definition. The application is still run as
# `python -m src.main` from this directory, and the Dockerfile still copies
# requirements-prod.txt before src/ so its layer cache keeps working. Adding
# [project] would force a src/ -> src/anheart/ rename touching every import.
#
# Why this much strictness: this code commands a motor with a person inside it.
# Passing a heart rate where revolutions-per-minute are expected, or missing an
# error case from the drive, must be a compile-time failure and not a surprise
# on the bench. See .claude/skills/anheart-strict-python/SKILL.md.

# =========================================================================
# Strict-check migration
# =========================================================================
# The modules below predate this contract and are excluded from BOTH type
# checkers until they are migrated. They are NOT exempt in spirit: the two in
# the safety chain (signal_processing.py, bitalino_client.py) carry the heart
# rate that drives the motor and are the first to be converted, once the
# hand-written stubs under stubs/ exist -- most of their 500-odd diagnostics
# are untyped numpy / biosppy / bitalino calls that the stubs resolve.
#
# tests/test_typing_contract.py pins this list exactly, so it can only be
# changed deliberately and can never quietly grow.
#
#   src/signal_processing.py   src/bitalino_client.py   src/convex_client.py
#   src/data_buffer.py         src/session_manager.py   src/main.py
#   tests/test_bitalino.py     tests/test_buffer.py     tests/test_convex_client.py
#   tests/test_config.py       scripts/*
#
# =========================================================================
# Static verification - basedpyright (primary)
# =========================================================================
# basedpyright over plain pyright because it reports the implicit `Any` that
# leaks in from untyped libraries (pymodbus, bitalino, biosppy) - which is
# exactly where holes would otherwise appear.
[tool.basedpyright]
# 3.12 rather than the 3.11 originally planned: numpy 2.5 ships stubs using
# PEP 695 `type` statements, which a 3.11 target rejects outright. The Docker
# base moves to 3.12 to match, so dev and production are judged alike.
pythonVersion = "3.12"
include = ["src", "tests", "scripts"]
# typing_fixtures holds deliberately-wrong modules that test_typing_contract.py
# runs the checker against on purpose; they must not fail the normal pass.
exclude = [
    "**/__pycache__",
    ".venv",
    "stubs",
    "tests/typing_fixtures",
    # --- pending strict-check migration (see banner above) ---
    "src/signal_processing.py",
    "src/bitalino_client.py",
    "src/convex_client.py",
    "src/data_buffer.py",
    "src/session_manager.py",
    "src/main.py",
    "tests/test_bitalino.py",
    "tests/test_buffer.py",
    "tests/test_convex_client.py",
    "tests/test_config.py",
    "scripts",
]
stubPath = "stubs"
typeCheckingMode = "strict"

reportAny = "error"
reportExplicitAny = "error"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportMissingTypeStubs = "error"
reportUnnecessaryIsInstance = "error"
# OFF deliberately, and this is a considered trade rather than a shortcut.
# basedpyright narrows a closed union so completely that the
# `case _ as unreachable: assert_never(unreachable)` guard at the end of a
# CORRECT exhaustive match is provably dead code, so this rule fires on every
# one of them. The guard has to stay: it is what makes an INCOMPLETE match fail,
# in both checkers, naming the variant that was forgotten (verified in
# tests/test_typing_contract.py). Redundant comparisons outside match statements
# are still caught, by mypy's `redundant-expr` error code.
reportUnnecessaryComparison = "none"
reportUnnecessaryContains = "error"
reportImplicitOverride = "error"
reportUninitializedInstanceVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportIncompatibleMethodOverride = "error"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"

# =========================================================================
# Static verification - mypy (second opinion)
# =========================================================================
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "stubs"
exclude = [
    "tests/typing_fixtures/",
    # --- pending strict-check migration (see banner above) ---
    "src/signal_processing[.]py$",
    "src/bitalino_client[.]py$",
    "src/convex_client[.]py$",
    "src/data_buffer[.]py$",
    "src/session_manager[.]py$",
    "src/main[.]py$",
    "tests/test_bitalino[.]py$",
    "tests/test_buffer[.]py$",
    "tests/test_convex_client[.]py$",
    "tests/test_config[.]py$",
    "scripts/",
]
strict = true

disallow_any_explicit = true
disallow_any_generics = true
disallow_any_unimported = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
no_implicit_reexport = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "exhaustive-match",
]

# The vendor libraries have no py.typed. Rather than silencing them, each is
# covered by a hand-written stub under stubs/ and touched from exactly ONE
# isolation module, so domain types are all the rest of the code ever sees.
# If a stub is incomplete the build fails here, which is the intent.
[[tool.mypy.overrides]]
module = ["peakutils.*"]
ignore_missing_imports = true

# =========================================================================
# Lint / format
# =========================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = ["stubs", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4",
    "DTZ", "T20", "PT", "RET", "SIM", "ARG", "PTH", "PL", "TRY",
    "FLY", "PERF", "FURB", "RUF",
]
ignore = [
    "PLR0913",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN401", "SLF001", "PLR0915"]
# Operator tools print by design and take paths from argv.
"scripts/**" = ["ANN001", "ANN201", "ANN202", "ASYNC250", "E501", "PERF401", "PLC0415", "PLR2004", "PLW1510", "PTH100", "PTH120", "RUF059", "S110", "S603", "S607", "SIM105", "T201", "TRY300", "TRY400"]

# --- pending strict-check migration ------------------------------------
# Same set of modules excluded from the type checkers (see the banner at the
# top of this file). Listed per-file rather than globally so the rules stay
# live for every migrated module, and so removing a file from this block is
# part of migrating it.
#
# Two entries here are REAL DEFECTS, not style debt, kept visible so they are
# not lost when the ignore disappears:
#   * bitalino_client.py ASYNC250 - pair_bluetooth_device() runs blocking
#     subprocess.run with 10/15/60 s timeouts from inside async connect(),
#     which can freeze the event loop for ~2 minutes. With a web UI that also
#     freezes the page and the emergency-stop endpoint.
#   * main.py RUF006 - handle_shutdown() calls asyncio.create_task from an OS
#     signal handler without holding the reference, and with no guarantee a
#     loop is running; on Windows that raises RuntimeError.
"src/signal_processing.py" = ["ANN001", "ANN201", "ANN204", "E501", "PLR0911", "PLR0912", "PLR2004", "S110", "SIM105", "TRY300", "TRY400"]
"src/convex_client.py" = ["ANN001", "ANN201", "ANN204", "ASYNC109", "E501", "PLR0917", "PLR2004", "RET504", "TRY300", "TRY301", "TRY400", "TRY401"]
"src/session_manager.py" = ["ANN001", "ANN201", "ANN204", "E501", "PLR2004", "RUF059", "TRY300", "TRY400"]
"src/data_buffer.py" = ["ANN001", "ANN201", "ANN204", "E501", "PERF401", "PLR2004", "RUF005", "S608", "TRY300"]
"src/main.py" = ["ANN001", "ANN201", "ANN202", "ARG001", "E501", "F841", "PLC0415", "PLW0602", "PLW0603", "RUF006", "T201", "TRY300", "TRY400", "TRY401"]
"tests/test_buffer.py" = ["ANN001", "ANN201", "ANN202", "PTH108", "PTH120"]
"tests/test_convex_client.py" = ["ANN001", "ANN201", "ANN202"]
"tests/test_config.py" = ["ANN001", "ANN201"]

[tool.ruff.lint.flake8-bugbear]
# NewType constructors are identity functions erased at runtime, so using one
# in a default argument is free. B008 exists for expensive or mutable defaults;
# `Monotonic(0.0)` is neither.
extend-immutable-calls = [
    "src.units.AdcCount",
    "src.units.Amperes",
    "src.units.Bpm",
    "src.units.BpmPerMinute",
    "src.units.GLoad",
    "src.units.GearRatio",
    "src.units.Hertz",
    "src.units.Metres",
    "src.units.Millivolts",
    "src.units.Monotonic",
    "src.units.MotorRpm",
    "src.units.OutputRpm",
    "src.units.RawRegister",
    "src.units.RegisterAddress",
    "src.units.ResultantG",
    "src.units.RpmPerSecond",
    "src.units.Seconds",
    "src.units.StatusWord",
    "src.units.UnixMillis",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false
suppress-none-returning = false
allow-star-arg-any = false
ignore-fully-untyped = false

# =========================================================================
# Tests
# =========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers --strict-config -m 'not hardware'"
markers = [
    "hardware: needs a real BITalino or ATV320 attached (excluded by default)",
    "slow: takes more than a second",
]

# =========================================================================
# Coverage
# =========================================================================
[tool.coverage.run]
branch = true
source = ["src"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# The blocking 100% gate covers the SAFETY CHAIN only: the heart rate that
# drives the motor comes out of bitalino_client + signal_processing, so a bad
# column parse or a mis-classified signal quality would make the machine
# accelerate on noise. Web/Convex/buffer code is reported separately and is
# not gate-blocking.
include = [
    "src/units.py",
    "src/result.py",
    "src/clock.py",
    "src/motor/*",
    "src/training/*",
    "src/sim/*",
    # bitalino_client.py and signal_processing.py belong here and are NOT
    # exempt: see [tool.anheart] coverage_pending below. They are listed there
    # instead of here so the gate has real teeth on migrated code today rather
    # than being switched off entirely while they are converted.
]
fail_under = 100
# `# pragma: no cover` is intentionally NOT an exclusion for the safety chain:
# an unreachable branch there is a design smell, not a waiver.
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    '\.\.\.$',
]

# =========================================================================
# Project bookkeeping (read by tests/test_typing_contract.py)
# =========================================================================
[tool.anheart]
# Safety-chain modules that are NOT yet under the 100% branch-coverage gate.
# The heart rate that commands the motor passes through both, so both must end
# up covered; they are pinned here so the debt is explicit and a test fails if
# this list ever grows or goes stale.
coverage_pending = [
    "src/bitalino_client.py",
    "src/signal_processing.py",
]

# The full set the gate must eventually cover: include + coverage_pending.
safety_chain = [
    "src/units.py",
    "src/result.py",
    "src/clock.py",
    "src/motor/*",
    "src/training/*",
    "src/sim/*",
    "src/bitalino_client.py",
    "src/signal_processing.py",
]
