# AnHeart Raspberry Pi - Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and configure
#   2. Run: docker-compose up -d
#   3. View logs: docker-compose logs -f
#   4. Stop: docker-compose down

services:
  anheart:
    build: .
    image: anheart-rpi:latest
    container_name: anheart
    restart: unless-stopped

    # Required for Bluetooth access
    privileged: true
    network_mode: host

    # Mount Bluetooth socket and D-Bus for Bluetooth access
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/run/bluetooth:/var/run/bluetooth
      - ./data:/app/data
      - ./.env:/app/.env:ro

    # Environment from .env file
    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import src.config; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
