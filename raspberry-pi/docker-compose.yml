# AnHeart Raspberry Pi - Docker Compose (operator console)
#
# Usage, on the Pi, from raspberry-pi/:
#   1. cp .env.pi.example .env   and fill it in (see docs/deploiement-raspberry-pi.md)
#   2. bash scripts/pi/preflight.sh
#   3. docker compose up -d --build
#   4. docker compose logs -f
#   5. docker compose down        (waits for the controlled ramp-down)
#
# The operator page is served on the Pi itself: http://127.0.0.1:${UI_PORT}/

services:
  anheart:
    build: .
    image: anheart-rpi:latest
    container_name: anheart
    # A restart never resumes motion: the console always comes back at rest,
    # read-only, and a drive found enabled at startup is zeroed and latched
    # until an operator acknowledges it.
    restart: unless-stopped

    # Bluetooth (BITalino) and the USB-RS485 adapter (ATV320).
    privileged: true
    # Host network: the page binds to the Pi's own loopback (UI_HOST=127.0.0.1),
    # and BlueZ is reached through the host's D-Bus.
    network_mode: host

    volumes:
      - /var/run/dbus:/var/run/dbus
      # The whole /dev, so a re-plugged adapter or a re-bound /dev/rfcomm0 is
      # seen without recreating the container.
      - /dev:/dev
      - ./data:/app/data

    # Environment from .env file
    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1

    # `docker stop` sends SIGTERM; the console ramps the motor down before it
    # exits. The default 10 s would kill it in the middle of the ramp.
    stop_grace_period: 60s
