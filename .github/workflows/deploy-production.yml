name: Déployer en production (main)

# Shown in the list of runs and on the page where a run is approved.
run-name: 'Production (${{ inputs.project }}) : avec Convex, hors séance ; gates non vérifiées'

# One of the two buttons that deploy to Vercel (docs/deploiement.md, sections
# 5.1 and 6.4). No push deploys anything: Git deployments are turned off for
# both Vercel projects by the `vercel.json` at the root of the repository.
#
# This one deploys the head of `main` to production: the site (Vercel project
# `anheart`), the hosted simulation (project `anheart-simulation`), or both.
# It starts from Actions, "Run workflow", and from nothing else. GitHub shows
# that button only for a workflow file present on the default branch.
#
# What this button does NOT check, and says where it is pressed: that the
# backend (Convex) is deployed in the same window, that no session is running,
# and that the gates of the commit are green.
#
# deploy-preview.yml is the same workflow for `develop` and the Preview
# environment of Vercel. The steps of the two deployment jobs run the same
# scripts in both files, which read the three variables of `env:` below: a
# change to one belongs in the other (scripts/ci/deploy-workflows.test.mjs
# compares them).
#
# What the repository settings must hold, set by hand (docs/deploiement.md,
# section 5.5): the GitHub environment `production`, restricted to `main`,
# with its approval rule and the four secrets read below. A missing secret
# fails the job before anything is installed.

on:
  workflow_dispatch:
    inputs:
      project:
        description: Quoi déployer en production
        required: true
        type: choice
        options:
          - site
          - simulation
          - site et simulation
      confirmation:
        description: 'Le site de production ne se déploie que dans la fenêtre du déploiement de Convex, jamais pendant une séance. Ce bouton ne vérifie pas que les gates du commit sont vertes. Pour confirmer, écrire le mot : production'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEPLOY_BRANCH: main
  VERCEL_TARGET: production
  # One exact version, never a range nor a moving tag. 62.1.0 is the version
  # Vercel's own build image ran for the site on 7 October 2026.
  VERCEL_CLI_VERSION: '62.1.0'

# No expression is written inside a script: what a script needs comes through
# `env:`. The token is given to the steps that call Vercel and to no other:
# neither the installation of the CLI nor the build of the site, which run the
# install scripts of npm packages, can read it. Nothing is cached, and nothing
# of what `vercel pull` writes on the runner (.vercel/, the variables of the
# project that Vercel lets be read back) is printed or uploaded.

jobs:
  # Runs first and without the environment: a request that cannot be served
  # is refused before anyone is asked to approve it, and what the button does
  # not check is written at the top of the run before the approval.
  request:
    name: Vérifier la demande (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuser toute autre branche
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/$DEPLOY_BRANCH" ]]; then
            echo "Référence reçue : $REF"
            echo "::error title=Mauvaise branche::Rien n'a été déployé. Ce bouton ne déploie que la branche $DEPLOY_BRANCH : relancer « Run workflow » en choisissant $DEPLOY_BRANCH dans « Use workflow from »."
            exit 1
          fi
          echo "Branche acceptée : $DEPLOY_BRANCH"
      - name: Exiger la confirmation saisie
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "$VERCEL_TARGET" ]]; then
            echo "::error title=Confirmation refusée::Rien n'a été déployé. Pour déployer en production, écrire exactement le mot production dans le champ de confirmation."
            exit 1
          fi
          echo "Confirmation reçue."
      - name: Rappeler les règles de ce bouton
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          {
            echo "### Production : à lire avant d'approuver"
            echo
            echo "- Demandé : $PROJECT, branche \`$DEPLOY_BRANCH\`, commit \`$GITHUB_SHA\`."
            echo "- Le site de production ne se déploie que dans la fenêtre du déploiement de Convex, jamais pendant une séance."
            echo "- Ce bouton ne vérifie pas que les gates du commit sont vertes."
          } >> "$GITHUB_STEP_SUMMARY"

  # The site is built here, the way Vercel documents for GitHub Actions:
  # `vercel pull` (settings and variables of the project), `vercel build`,
  # then `vercel deploy --prebuilt`, which uploads what was built. The build is
  # the one Vercel ran at each push: the same CLI command, `npm install` then
  # `npm run build`, on Node 24. The output goes up as an archive, so that its
  # many files do not count one by one against the daily upload limit.
  #
  # The checkout takes the head of the branch as it is when the job starts,
  # and the job goes on only if that is still the commit the run was started
  # on: a run approved late, or run again, never deploys an older commit.
  site:
    name: Déployer le site (production)
    needs: request
    if: ${{ inputs.project == 'site' || inputs.project == 'site et simulation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: vercel-production-site
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SITE }}
      NOT_DEPLOYED: Le site n'a pas été déployé
    steps:
      - name: Exiger les secrets du déploiement
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID_NAME: VERCEL_PROJECT_ID_SITE
        run: |
          missing=()
          [[ -n "$VERCEL_TOKEN" ]] || missing+=(VERCEL_TOKEN)
          [[ -n "$VERCEL_ORG_ID" ]] || missing+=(VERCEL_ORG_ID)
          [[ -n "$VERCEL_PROJECT_ID" ]] || missing+=("$PROJECT_ID_NAME")
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Secret manquant::$NOT_DEPLOYED. Secret absent ou vide dans l'environnement GitHub de ce job : ${missing[*]}. Voir docs/deploiement.md (section 5.5)."
            exit 1
          fi
          echo "Les secrets du déploiement sont présents."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: refs/heads/main
      - name: Refuser un commit qui n'est plus la tête de la branche
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::error title=Exécution périmée::$NOT_DEPLOYED. Cette exécution a été lancée sur le commit $GITHUB_SHA, et la tête de $DEPLOY_BRANCH est maintenant $head. Ne pas la relancer : lancer une nouvelle exécution par « Run workflow »."
            exit 1
          fi
          echo "Le commit $head est encore la tête de $DEPLOY_BRANCH."
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Installer la CLI Vercel à sa version figée
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Lire les réglages et les variables du projet Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(pull --yes "--environment=$VERCEL_TARGET")
          if [[ "$VERCEL_TARGET" == preview ]]; then
            args+=("--git-branch=$DEPLOY_BRANCH")
          fi
          vercel "${args[@]}"
      - name: Construire le site
        run: |
          args=(build)
          if [[ "$VERCEL_TARGET" == production ]]; then
            args+=(--prod)
          fi
          vercel "${args[@]}"
      - name: Déployer la construction du site
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(deploy --prebuilt --archive=tgz)
          if [[ "$VERCEL_TARGET" == production ]]; then
            args+=(--prod)
          fi
          url="$(vercel "${args[@]}")"
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error title=Adresse absente::La CLI Vercel a terminé sans rendre l'adresse du déploiement. Vérifier dans Vercel si le déploiement a eu lieu."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Annoncer le commit et l'adresse
        env:
          DEPLOYED: Site
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          commit="$(git rev-parse HEAD)"
          {
            echo "### $DEPLOYED : déployé sur Vercel ($VERCEL_TARGET)"
            echo
            echo "- Commit déployé : \`$commit\` (tête de \`$DEPLOY_BRANCH\` au lancement)"
            echo "- Adresse du déploiement : $URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYED : commit $commit déployé à l'adresse $URL"

  # The simulation keeps its own procedure, the one of
  # deploy/simulation-vercel/deploy.sh: `build.sh` assembles dist/ from the
  # checkout, the CLI uploads that directory and Vercel builds it. Nothing of
  # Python is installed here, and the hosted engine reads no variable of its
  # Vercel project.
  simulation:
    name: Déployer la simulation (production)
    needs: request
    if: ${{ inputs.project == 'simulation' || inputs.project == 'site et simulation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: vercel-production-simulation
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SIMULATION }}
      NOT_DEPLOYED: La simulation n'a pas été déployée
    steps:
      - name: Exiger les secrets du déploiement
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID_NAME: VERCEL_PROJECT_ID_SIMULATION
        run: |
          missing=()
          [[ -n "$VERCEL_TOKEN" ]] || missing+=(VERCEL_TOKEN)
          [[ -n "$VERCEL_ORG_ID" ]] || missing+=(VERCEL_ORG_ID)
          [[ -n "$VERCEL_PROJECT_ID" ]] || missing+=("$PROJECT_ID_NAME")
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Secret manquant::$NOT_DEPLOYED. Secret absent ou vide dans l'environnement GitHub de ce job : ${missing[*]}. Voir docs/deploiement.md (section 5.5)."
            exit 1
          fi
          echo "Les secrets du déploiement sont présents."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: refs/heads/main
      - name: Refuser un commit qui n'est plus la tête de la branche
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::error title=Exécution périmée::$NOT_DEPLOYED. Cette exécution a été lancée sur le commit $GITHUB_SHA, et la tête de $DEPLOY_BRANCH est maintenant $head. Ne pas la relancer : lancer une nouvelle exécution par « Run workflow »."
            exit 1
          fi
          echo "Le commit $head est encore la tête de $DEPLOY_BRANCH."
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Installer la CLI Vercel à sa version figée
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Assembler la simulation
        run: |
          if [[ ! -f deploy/simulation-vercel/build.sh ]]; then
            echo "::error title=Simulation absente::$NOT_DEPLOYED. La branche $DEPLOY_BRANCH ne contient pas la simulation hébergée (deploy/simulation-vercel/build.sh)."
            exit 1
          fi
          bash deploy/simulation-vercel/build.sh
      - name: Déployer la simulation assemblée
        id: deploy
        working-directory: deploy/simulation-vercel/dist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(deploy --yes)
          if [[ "$VERCEL_TARGET" == production ]]; then
            args+=(--prod)
          fi
          url="$(vercel "${args[@]}")"
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error title=Adresse absente::La CLI Vercel a terminé sans rendre l'adresse du déploiement. Vérifier dans Vercel si le déploiement a eu lieu."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Annoncer le commit et l'adresse
        env:
          DEPLOYED: Simulation
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          commit="$(git rev-parse HEAD)"
          {
            echo "### $DEPLOYED : déployé sur Vercel ($VERCEL_TARGET)"
            echo
            echo "- Commit déployé : \`$commit\` (tête de \`$DEPLOY_BRANCH\` au lancement)"
            echo "- Adresse du déploiement : $URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYED : commit $commit déployé à l'adresse $URL"
