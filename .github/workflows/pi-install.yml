name: Pi install

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/pi-install.yml'
      - 'raspberry-pi/.dockerignore'
      - 'raspberry-pi/.env.pi.example'
      - 'raspberry-pi/Dockerfile'
      - 'raspberry-pi/VERSION'
      - 'raspberry-pi/docker/**'
      - 'raspberry-pi/requirements*.txt'
      - 'raspberry-pi/scripts/anheart.service'
      - 'raspberry-pi/scripts/harden.sh'
      - 'raspberry-pi/scripts/install.sh'
      - 'raspberry-pi/scripts/pi/bind-bitalino.sh'
      - 'raspberry-pi/scripts/pi/configure_network.sh'
      - 'raspberry-pi/scripts/pi/test_network.sh'
      - 'raspberry-pi/scripts/pi/test_network_packets.py'
      - 'raspberry-pi/scripts/pi/network-test.Dockerfile'
      - 'raspberry-pi/scripts/pi/configure_storage.sh'
      - 'raspberry-pi/scripts/pi/prepare_drive_lock.py'
      - 'raspberry-pi/scripts/pi/storage-test.Dockerfile'
      - 'raspberry-pi/scripts/pi/test_storage.sh'
      - 'raspberry-pi/scripts/pi/test_install.sh'
      - 'raspberry-pi/scripts/uninstall.sh'
  push:
    branches: [develop]
  workflow_dispatch:
  # Called by the release pipeline (release.yml), on the commit of `main` it
  # is about to publish: a push to `main` does not start this workflow.
  workflow_call:

permissions:
  contents: read

# One run at a time per pull request: a new push replaces the one in progress.
# A push to develop and a manual run are keyed by their commit: none is
# cancelled nor left waiting behind another.
concurrency:
  group: pi-install-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# The install of the Raspberry Pi, end to end and without a Raspberry Pi
# (docs/pi-image.md, "Ce que la CI vérifie"). On an arm64 runner, the
# architecture of the Pi 4 and 5, a stand-in machine (Debian 12, systemd) is
# started as a container; the real raspberry-pi/scripts/install.sh is run in
# it as root and must leave the console enabled at boot, running in
# simulation, answering GET /healthz and at rest, as an account that is not
# root. scripts/harden.sh is then run there dry, then for good, and
# scripts/uninstall.sh after it. The script that does it,
# raspberry-pi/scripts/pi/test_install.sh, can be run on any machine with
# Docker.
#
# Before that, the scripts that run as root on a Pi, and the test itself, are
# read by ShellCheck: a warning or an error fails the job. Its notes of style
# (a `$` meant for another shell inside single quotes, `A && B || C` where C
# ends the script) are not findings.
#
# Not a gate. The job below is not a required check: a pull request is filtered
# by path, and a workflow that does not start would leave a required check
# pending. It runs on pull requests that change what the install is made of,
# and on every push to develop, where a change of the console's sources that
# breaks its start in the image is caught. The job may not take the name of a
# job of ci.yml.
#
# Nothing is published, signed or deployed, and no secret is read: the token of
# each run can only read the repository.

jobs:
  pi-install:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Lint the shell scripts of the Raspberry Pi
        run: |
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          fi
          shellcheck --version
          shellcheck --severity=warning \
            raspberry-pi/scripts/install.sh \
            raspberry-pi/scripts/harden.sh \
            raspberry-pi/scripts/uninstall.sh \
            raspberry-pi/scripts/pair_device.sh \
            raspberry-pi/scripts/pi/bind-bitalino.sh \
            raspberry-pi/scripts/pi/configure_network.sh \
            raspberry-pi/scripts/pi/test_network.sh \
            raspberry-pi/scripts/pi/configure_storage.sh \
            raspberry-pi/scripts/pi/test_storage.sh \
            raspberry-pi/scripts/pi/deploy.sh \
            raspberry-pi/scripts/pi/preflight.sh \
            raspberry-pi/scripts/pi/test_install.sh \
            raspberry-pi/docker/entrypoint.sh
      - name: Install the console on a stand-in Raspberry Pi
        run: |
          echo "Runner: $(uname -m), $(nproc) CPUs, $(docker --version)"
          bash raspberry-pi/scripts/pi/test_install.sh
      - name: Validate network configuration and kernel isolation
        run: |
          docker build -t anheart-network-test -f raspberry-pi/scripts/pi/network-test.Dockerfile raspberry-pi/scripts/pi
          docker run --rm --privileged --network none \
            --volume "$GITHUB_WORKSPACE/raspberry-pi:/repo:ro" \
            anheart-network-test bash /repo/scripts/pi/test_network.sh
      - name: Validate encrypted storage, overlay and shared drive lock
        run: |
          docker build -t anheart-storage-test -f raspberry-pi/scripts/pi/storage-test.Dockerfile raspberry-pi/scripts/pi
          docker run --rm --privileged --network none \
            --volume "$GITHUB_WORKSPACE/raspberry-pi:/repo:ro" \
            anheart-storage-test bash /repo/scripts/pi/test_storage.sh
