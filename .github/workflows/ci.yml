name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      # The nightly endurance of the session record, asked for by hand: the
      # step of `pi (tests 1)` that otherwise runs on the nightly event alone.
      # Off unless ticked, so that a manual run costs what it always did. It
      # starts that step and nothing else: the other nightly endurance, the
      # one of the whole console in `simulation (report)`, runs on the nightly
      # event alone and has no box.
      endurance:
        description: "Lancer aussi l'endurance nocturne de l'enregistrement de séance, et elle seule : une journée simulée, jusqu'à 35 minutes de plus dans « pi (tests 1) ». L'endurance de la console entière, dans « simulation (report) », ne tourne que la nuit."
        required: false
        type: boolean
        default: false
  # Called by the release pipeline (release.yml), on the commit of `main` it
  # is about to publish. A called workflow sees the event of its caller, a
  # manual run: no gate is skipped by the path rule, and the synthetic report
  # runs with its `--dsp` scenarios, as on any manual run. It declares no
  # input: a caller cannot ask for the endurance of the session record, and
  # the release pipeline runs neither of the two nightly endurances.
  workflow_call:

permissions:
  contents: read

# Keep `github.workflow` in this group: a reusable workflow sees its caller's
# workflow name. The release call has its own group, so it neither waits behind
# nor cancels CI's push or nightly run on `main`; `release.yml` separately
# allows one release at a time in `release-production`. See
# `scripts/ci/ci-workflow.test.mjs`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The simulation battery is cut into this many shares. The matrix of
  # `simulation-battery` must name each of them once (0 to this number minus
  # one): `simulation-gate` fails if a share is missing or if a test ran twice.
  SIMULATION_SHARES: '13'
  # The tests of the Pi are cut into this many shares, one pytest process
  # each. The matrix of `pi-tests` must name each of them once, like the one
  # of the battery: `pi-gate` fails if a share is missing or if a test ran twice.
  PI_SHARES: '8'
  # For the quality report (see `quality-report` below): what makes
  # `node --test` and vitest keep a JUnit file next to their usual output.
  # Where the file goes follows on each line that uses them.
  NODE_TEST_REPORT: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
  VITEST_REPORT: --reporter=default --reporter=github-actions --reporter=junit

# Which gates run (docs/framework-de-test.md, section CI).
#
# `changes` reads the files a pull request changes (scripts/ci/gates-for-changes.mjs).
# The jobs that depend on it carry the same condition: they are skipped only
# on a pull request, and only when `changes` answered an explicit 'false'.
# A push, the nightly run, a manual run, a `changes` job that failed or said
# nothing: every gate runs. `!cancelled()` is what lets a gate run when
# `changes` failed; without it GitHub would skip the gate and report the
# required check as passed. `docs` and `audit` never depend on `changes`.
#
# `pi-gate` and `simulation-gate` say `always()` where the others say
# `!cancelled()`: each waits for other jobs, so a run cancelled while they
# work would otherwise skip it, and a skipped job passes a required check. It
# starts instead, and fails because a part did not succeed. The others do not
# wait for the work of another job: cancelled while they run, they report
# "cancelled". Only a run cancelled during the few seconds of `changes` leaves
# them skipped.
#
# The names `pi-gate`, `simulation-gate`, `convex-tests`, `web`, `audit` and
# `docs` are required by branch protection: each must stay the name of one
# job, never of a matrix (a skipped matrix job reports under another name).
#
# The quality report (docs/framework-de-test.md, "Rapport de qualité") adds to
# the gates without deciding any: the test runners keep a JUnit file, the gate
# scripts say how each stage ended, and the steps named "Quality report" and
# "Keep the numbers for the quality report" read and publish that. Each of
# those steps carries `continue-on-error: true`: none can turn a gate red.
# `quality-report`, the last job, is not a required check, and no step of it
# can fail it.
#
# The coverage of Convex and of the site is another matter: it is part of
# their gates (docs/framework-de-test.md, "Seuils de couverture de Convex et
# du site"). The steps named "Enforce the coverage" of `convex-tests` and of
# `web` fail under the threshold written in scripts/ci/coverage-thresholds.mjs
# and carry no `continue-on-error`. The report reads the measure they leave.

jobs:
  # The table of the run, one line per project, written on the page of the
  # run. It waits for every gate and runs whatever happened to them
  # (`always()`): a gate that failed, was skipped by the path rule or was
  # cancelled is a line of the table, not a reason to have no table. Every
  # step continues on error: the worst a step can do is leave the summary
  # saying "rapport indisponible". What is left that can end this job other
  # than green is not a step: its time limit, a runner that fails, a run that
  # is cancelled. No required check depends on it; scripts/release.sh, which
  # reads every check of a commit, would then ask for a rerun. It reads how
  # each job ended from `needs`, the answer of the path rule included, so that
  # the rule is still read in one place only.
  quality-report:
    needs: [changes, pi-gate, simulation-gate, convex-tests, web, audit, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Gather the numbers every job left
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: quality-*
          path: ${{ runner.temp }}/quality
      - name: Quality report of the run
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # GitHub anchors the summary of a job at this number: the notice the
          # report emits ends on the address of the table.
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: node scripts/ci/quality-report.mjs report --artifacts "$RUNNER_TEMP/quality" --out "$RUNNER_TEMP/quality-report"
      # Should the script itself be missing or unable to start.
      - name: Say so when no report was written
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ ! -s "$RUNNER_TEMP/quality-report/quality-report.json" ]]; then
            echo '**Rapport de qualité : rapport indisponible.** Aucune gate ne dépend de lui.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish quality-report.json
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-report
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality-report

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.rule.outputs.python }}
      node: ${{ steps.rule.outputs.node }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      # The tests of this rule and of the workflows are a step of `docs`: this
      # job is not a required check, so a test failing here blocked no merge.
      - name: Decide which gates this run needs
        id: rule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          changed="$RUNNER_TEMP/changed-paths"
          : > "$changed"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # The checkout is the merge of the pull request into its base
            # branch: its first parent is the base, its second the pull request.
            # Renames are listed under both names, removals like any change.
            git rev-parse --verify --quiet 'HEAD^2' > /dev/null
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$changed"
          fi
          node scripts/ci/gates-for-changes.mjs --event "$EVENT_NAME" < "$changed" | tee -a "$GITHUB_OUTPUT"

  # The tests of the Pi gate, cut into PI_SHARES shares, one pytest process
  # each, four to a runner: as many as it has CPUs. `pi-gate` judges them.
  pi-tests:
    name: pi (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tests 1
            shares: 0-3
            endurance: true
          - part: tests 2
            shares: 4-7
            endurance: false
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          lfs: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: pi-gate
      - name: Install Python dependencies
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes -r raspberry-pi/requirements-dev-lock.txt
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes --no-deps -r raspberry-pi/requirements-dev-nodeps-lock.txt
      - name: Pi gate, shares ${{ matrix.shares }} of the tests
        env:
          PYTEST_ADDOPTS: --durations=25
          PI_GATE_SHARES: ${{ matrix.shares }}/${{ env.PI_SHARES }}
          PI_GATE_EVIDENCE: ${{ runner.temp }}/pi-evidence
          # Inside the evidence, so that it reaches `pi-gate` with it.
          QUALITY_REPORT_DIR: ${{ runner.temp }}/pi-evidence/quality-${{ matrix.shares }}
        run: |
          echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          bash raspberry-pi/scripts/check.sh
      # The nightly run, or a manual run that asks for it (the `endurance`
      # box of the button), and in one part only: a simulated day of sessions
      # with the session record written, heap, object count and tick cost
      # judged per session (raspberry-pi/tests/test_record_endurance.py). The
      # same loop runs for a few simulated minutes in the tests above, on
      # every run. A failure here fails this part, hence `pi-gate`.
      # `inputs.endurance` is the box of a manual run of THIS workflow and
      # nothing else: empty on every other event, and in a run called by
      # another workflow, which can hand this one no input. Compared with
      # `true` so that no text, the word "false" included, can stand for a
      # ticked box.
      - name: Pi endurance, a simulated day of sessions with the session record written
        if: ${{ (github.event_name == 'schedule' || inputs.endurance == true) && matrix.endurance }}
        timeout-minutes: 35
        working-directory: raspberry-pi
        env:
          ANHEART_ENDURANCE_HOURS: '24'
        run: .venv/bin/python -m pytest tests/test_record_endurance.py -m slow -s
      # One artifact per part, replaced when the part is run again: the gate
      # must judge the latest run of each part, never two runs of the same one.
      - name: Keep what these shares recorded and measured
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pi-evidence-${{ matrix.shares }}
          retention-days: 14
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          path: ${{ runner.temp }}/pi-evidence

  # The required check. It passes only if every part above succeeded AND the
  # records they left prove that every test of the console ran exactly once,
  # with 100 % of branches covered on the safety chain once their measures
  # are merged: the threshold is applied here, once, to the total.
  pi-gate:
    needs: [changes, pi-tests]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      # Runs whatever happened to the run, cancelled included: a part that was
      # cancelled, that failed, that ran out of time or that was skipped when
      # it should not have been must leave this required check failed.
      - name: Every part of the gate succeeded
        if: ${{ always() }}
        env:
          TESTS: ${{ needs.pi-tests.result }}
        run: |
          echo "pi tests (all parts): $TESTS"
          [[ "$TESTS" == success ]]
      # The steps below run even when a part failed: what did run is still
      # judged and shown, and the job stays failed because of the step above.
      # They do not run when the run was cancelled.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: ${{ !cancelled() }}
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: pi-gate
      - name: Install Python dependencies
        if: ${{ !cancelled() }}
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes -r raspberry-pi/requirements-dev-lock.txt
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes --no-deps -r raspberry-pi/requirements-dev-nodeps-lock.txt
      - name: Gather what every share recorded and measured
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pi-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/pi-evidence
      - name: Pi gate, every test once and combined coverage
        if: ${{ !cancelled() }}
        env:
          PI_GATE_COMBINE: ${{ env.PI_SHARES }}
          PI_GATE_EVIDENCE: ${{ runner.temp }}/pi-evidence
          QUALITY_REPORT_DIR: ${{ runner.temp }}/quality
        run: bash raspberry-pi/scripts/check.sh
      # The same list of paths in `pi-gate` and in `simulation-gate`, as when
      # one job published both: it is what keeps each file under its full
      # path inside the artifact (raspberry-pi/coverage.xml, simulation/...).
      - name: Publish coverage and synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pi-gate-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            raspberry-pi/coverage.xml
            simulation/coverage.xml
            simulation/out/ci/report.json
            simulation/out/ci/report.html
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/ci/quality-report.mjs job pi --dir "$RUNNER_TEMP/quality" --parts "$RUNNER_TEMP/pi-evidence" --shares "$PI_SHARES"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-pi
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  # The scenario battery of the simulation gate, cut into SIMULATION_SHARES
  # shares, one pytest process each. Share 0 is the cohort, which uses every
  # CPU by itself: it has a runner of its own. `simulation-gate` judges them.
  simulation-battery:
    name: simulation (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: cohort
            shares: 0-0
          - part: battery 1
            shares: 1-4
          - part: battery 2
            shares: 5-8
          - part: battery 3
            shares: 9-12
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          lfs: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: simulation-gate
      - name: Install Python dependencies
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes -r raspberry-pi/requirements-dev-lock.txt
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes --no-deps -r raspberry-pi/requirements-dev-nodeps-lock.txt
      # In every part: the test of the CAD extraction is skipped without it,
      # and no part knows in advance which one will be given that test.
      - name: Install and verify CAD extractor
        run: |
          uv venv simulation/cad/.venv-cad
          uv pip install --python simulation/cad/.venv-cad/bin/python -r simulation/cad/requirements.txt
          simulation/cad/.venv-cad/bin/python simulation/cad/extract_geometry.py CAO/Gaura_Assy_2907.STEP "$RUNNER_TEMP/cad-preflight.json"
      - name: Simulation gate, shares ${{ matrix.shares }} of the battery
        env:
          PYTEST_ADDOPTS: --durations=15
          SIMULATION_GATE_SHARES: ${{ matrix.shares }}/${{ env.SIMULATION_SHARES }}
          SIMULATION_GATE_EVIDENCE: ${{ runner.temp }}/simulation-evidence
          # Inside the evidence, so that it reaches `simulation-gate` with it.
          QUALITY_REPORT_DIR: ${{ runner.temp }}/simulation-evidence/quality-${{ matrix.shares }}
        run: |
          echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          bash simulation/scripts/check.sh
      # One artifact per part, replaced when the part is run again: the gate
      # must judge the latest run of each part, never two runs of the same one.
      - name: Keep what these shares recorded and measured
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simulation-evidence-${{ matrix.shares }}
          retention-days: 14
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          path: ${{ runner.temp }}/simulation-evidence

  simulation-report:
    name: simulation (report)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    # 90 minutes for the synthetic report (with its `--dsp` scenarios at
    # night), and the 240 of the nightly endurance step below.
    timeout-minutes: 330
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: simulation-gate
      - name: Install Python dependencies
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes -r raspberry-pi/requirements-dev-lock.txt
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes --no-deps -r raspberry-pi/requirements-dev-nodeps-lock.txt
      - name: Synthetic simulation report
        timeout-minutes: 90
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--all --workers 2 --out simulation/out/ci)
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--dsp)
          fi
          raspberry-pi/.venv/bin/python -m simulation.quick "${args[@]}"
      # The nightly run only: 24 simulated hours of the whole console
      # (simulation/endurance.py: the real runtime, the acquisition, the
      # session record on disk and the dashboard link, against the dashboard
      # double of the tests), judged on its resident memory, the duration of
      # its tick, its open descriptors and its data folder. The same scenario
      # runs a few simulated minutes in the battery, on every run
      # (simulation/tests/test_endurance.py). A failure here fails this job,
      # hence `simulation-gate`. Its report is kept with the synthetic ones.
      - name: Console endurance, 24 simulated hours of sessions
        if: ${{ github.event_name == 'schedule' }}
        timeout-minutes: 240
        run: raspberry-pi/.venv/bin/python -m simulation.endurance simulated --hours 24 --out simulation/out/ci/endurance
      - name: Keep the synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simulation-report
          retention-days: 14
          if-no-files-found: error
          overwrite: true
          path: |
            simulation/out/ci/report.json
            simulation/out/ci/report.html
            simulation/out/ci/endurance/endurance.json
            simulation/out/ci/endurance/endurance.md
            simulation/out/ci/endurance/console.log

  # The required check. It passes only if every part above succeeded AND the
  # records they left prove that every test of the battery ran exactly once,
  # with 100 % of branches covered once their measures are merged.
  simulation-gate:
    needs: [changes, simulation-battery, simulation-report]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      # Runs whatever happened to the run, cancelled included: a part that was
      # cancelled, that failed, that ran out of time or that was skipped when
      # it should not have been must leave this required check failed.
      - name: Every part of the gate succeeded
        if: ${{ always() }}
        env:
          BATTERY: ${{ needs.simulation-battery.result }}
          REPORT: ${{ needs.simulation-report.result }}
        run: |
          echo "simulation battery (all parts): $BATTERY"
          echo "simulation report: $REPORT"
          [[ "$BATTERY" == success && "$REPORT" == success ]]
      # The steps below run even when a part failed: what did run is still
      # judged and shown, and the job stays failed because of the step above.
      # They do not run when the run was cancelled.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: ${{ !cancelled() }}
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: simulation-gate
      - name: Install Python dependencies
        if: ${{ !cancelled() }}
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes -r raspberry-pi/requirements-dev-lock.txt
          uv pip install --python raspberry-pi/.venv/bin/python --require-hashes --no-deps -r raspberry-pi/requirements-dev-nodeps-lock.txt
      - name: Gather what every share recorded and measured
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: simulation-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/simulation-evidence
      - name: Gather the synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: simulation-report
          path: simulation/out/ci
      - name: Simulation gate, every test once and combined coverage
        if: ${{ !cancelled() }}
        env:
          SIMULATION_GATE_COMBINE: ${{ env.SIMULATION_SHARES }}
          SIMULATION_GATE_EVIDENCE: ${{ runner.temp }}/simulation-evidence
          QUALITY_REPORT_DIR: ${{ runner.temp }}/quality
        run: bash simulation/scripts/check.sh
      # Part of the gate: the hosted simulation engine, the wrapper Vercel
      # serves (deploy/simulation-vercel/app.py) and the entry point of the
      # Git layout (simulation_app.py). Its tests drive the real simulation
      # runtime through the HTTP routes of the wrapper; no job ran them. In
      # this job because it is the required check of the simulation, with the
      # environment those tests need already installed, and because the path
      # rule runs it for every file they read. From the repository root, where
      # pyproject.toml gives pytest its paths. Nothing here reaches Vercel.
      - name: Test the hosted simulation engine
        if: ${{ !cancelled() }}
        run: raspberry-pi/.venv/bin/python -m pytest deploy/simulation-vercel/tests
      # Install the assembled payload in isolation and serve an HTTP request
      # with hashes required, as Vercel receives it. This proves the payload
      # works on the runner, not that Vercel itself has built it.
      - name: Install the hosted simulation as Vercel receives it, hashes required
        if: ${{ !cancelled() }}
        run: |
          bash deploy/simulation-vercel/build.sh
          hosted_venv="$RUNNER_TEMP/hosted-simulation-venv"
          uv venv "$hosted_venv"
          uv pip install --python "$hosted_venv/bin/python" --require-hashes -r deploy/simulation-vercel/dist/requirements.txt
          cd deploy/simulation-vercel/dist
          env -u PYTHONPATH "$hosted_venv/bin/python" - <<'PY'
          from app import app
          from fastapi.testclient import TestClient

          with TestClient(app) as client:
              response = client.get("/api/scenarios")
              print(response.status_code)
              if response.status_code != 200:
                  raise SystemExit(1)
          PY
      - name: Publish coverage and synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simulation-gate-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            raspberry-pi/coverage.xml
            simulation/coverage.xml
            simulation/out/ci/report.json
            simulation/out/ci/report.html
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/ci/quality-report.mjs job simulation --dir "$RUNNER_TEMP/quality" --parts "$RUNNER_TEMP/simulation-evidence" --scenarios simulation/out/ci/report.json --shares "$SIMULATION_SHARES"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-simulation
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  convex-tests:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.node != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Part of the gate: convex/_generated/api.d.ts, which is committed, must
      # be what the files of convex/ imply (scripts/ci/convex-generated-api.mjs).
      # The command of the package that writes it needs a deployment, and this
      # workflow has none and reaches none: the script derives the file from
      # the tree. Before the type-check, which a stale file would otherwise
      # fail without saying why, or not fail at all.
      - name: Check the committed bindings of the Convex functions
        run: node scripts/ci/convex-generated-api.mjs
      - name: Type-check the Convex functions
        id: types
        run: npx tsc -p convex/tsconfig.json --noEmit
      - run: npm run test:convex -- $VITEST_REPORT --outputFile.junit="$RUNNER_TEMP/quality/convex.xml"
      # Part of the gate: the same tests once more, measured this time. The
      # command fails under 80 % of lines or of branches, on `convex/` as a
      # whole or on one of the three files of the safety chain taken alone
      # (scripts/ci/coverage-thresholds.mjs). It runs even when a test above
      # failed, so that the quality report still has its measure.
      - name: Enforce the coverage of the Convex functions
        if: ${{ !cancelled() }}
        run: npm run coverage:convex -- --reporter=default --coverage.reportsDirectory="$RUNNER_TEMP/quality/coverage-convex"
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TYPES_OUTCOME: ${{ steps.types.outcome }}
        run: node scripts/ci/quality-report.mjs job convex --dir "$RUNNER_TEMP/quality"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-convex
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  web:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.node != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CONVEX_URL: https://ci-fixture.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: types
        run: npx tsc --noEmit
      - id: lint
        run: npm run lint
      - name: Test the local panel of the console
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/pi-panel.xml" raspberry-pi/tests/web/*.test.mjs
      - run: npm run test:lib -- $VITEST_REPORT --outputFile.junit="$RUNNER_TEMP/quality/site-lib.xml"
      - run: npm run test:site -- $VITEST_REPORT --outputFile.junit="$RUNNER_TEMP/quality/site-components.xml"
      - run: npm run build
      # Part of the gate: every test of the site once more, in one run,
      # measured this time. The command fails under 80 % of lines or of
      # branches on the measured folders of the site
      # (scripts/ci/coverage-thresholds.mjs). It runs even when a step above
      # failed, so that the quality report still has its measure.
      - name: Enforce the coverage of the site
        if: ${{ !cancelled() }}
        run: npm run coverage:site -- --reporter=default --coverage.reportsDirectory="$RUNNER_TEMP/quality/coverage-site"
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: node scripts/ci/quality-report.mjs job site --dir "$RUNNER_TEMP/quality"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-site
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  # The dependencies and the history of the repository (docs/framework-de-test.md,
  # "Dépendances : un gestionnaire, des versions figées, un audit"). Each audit
  # fails this required check on what it finds: npm on a high or critical
  # advisory, pip-audit on any known vulnerability, gitleaks on a secret. The
  # only advisories skipped are the exceptions written, each with its expiry
  # day, in .github/audit-exceptions.md, read by scripts/ci/audit-exceptions.mjs.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
      - run: npm ci
      # A malformed table, or an exception from its expiry day on, fails the
      # job whatever the audits find.
      - name: Read the exceptions of the audit
        if: ${{ !cancelled() }}
        run: node scripts/ci/audit-exceptions.mjs check
      # npm decides alone unless it finds something. Then the exceptions are
      # read, and the step passes only if every high or critical advisory is
      # one of them. Moderate and low advisories are printed and fail nothing.
      - name: Audit npm dependencies
        if: ${{ !cancelled() }}
        run: |
          if npm audit --audit-level=high; then
            exit 0
          fi
          node scripts/ci/audit-exceptions.mjs npm
      # The test file of `npm run test:dependency-security`, run directly so
      # that it can be told where to keep its JUnit file.
      - name: Verify dependency stack-depth guards
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-dependency-guard.xml" scripts/ci/braces-depth-guard.test.mjs
      # Each Python environment the project installs, audited on its own, as
      # it is installed. The five locks of the Pi image, development/CI and
      # hosted simulation are read as they are, every version and hash fixed.
      # Only the CAD extractor is resolved first for Python 3.12 with the
      # packages it pulls in, since its input fixes only some versions.
      # pip-audit fails on any known vulnerability, whatever its severity,
      # except the Python exceptions. Every environment is audited, even
      # after one has failed.
      - name: Audit Python dependencies
        if: ${{ !cancelled() }}
        run: |
          skipped="$(node scripts/ci/audit-exceptions.mjs pip-audit-args)"
          read -r -a ignore <<< "$skipped"
          failed=()
          audit() {
            echo "pip-audit: $1"
            uv tool run pip-audit==2.9.0 --disable-pip --require-hashes "${ignore[@]}" -r "$2" || failed+=("$1")
          }
          for lock in raspberry-pi/requirements-lock.txt raspberry-pi/requirements-build-lock.txt raspberry-pi/requirements-dev-lock.txt raspberry-pi/requirements-dev-nodeps-lock.txt deploy/simulation-vercel/requirements-lock.txt; do
            audit "$lock" "$lock"
          done
          for set in simulation/cad/requirements.txt; do
            resolved="$RUNNER_TEMP/audit-${set//\//-}"
            uv pip compile "$set" --python-version 3.12 --generate-hashes --quiet --output-file "$resolved"
            audit "$set" "$resolved"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error title=Vulnérabilité Python::pip-audit a trouvé une vulnérabilité connue dans : ${failed[*]}. Prendre une version corrigée, ou écrire une exception datée dans .github/audit-exceptions.md."
            exit 1
          fi
      - name: Scan all Git history
        if: ${{ !cancelled() }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          anheart_gitleaks_bin="$(go env GOPATH)/bin/gitleaks"
          mkdir -p "$RUNNER_TEMP/quality"
          ANHEART_GITLEAKS_BIN="$anheart_gitleaks_bin" node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-gitleaks-fixture.xml" scripts/ci/gitleaks-fixture.test.mjs
          "$anheart_gitleaks_bin" git --redact --log-opts='--all'
      # The bill of materials, in the CycloneDX format, of what is installed
      # from a lock file: the npm packages of the site and of Convex
      # (package-lock.json, development packages marked as such), the Python
      # packages of the image of the Pi, the tools that build it and the
      # hosted simulation. Written on every run,
      # including the run of the release pipeline, which calls this workflow on
      # the commit it tags: the artifact `sbom` of that run is the bill of
      # materials of the release (docs/release.md).
      - name: Write the bill of materials
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          npm sbom --sbom-format cyclonedx --package-lock-only > "$RUNNER_TEMP/sbom/site-convex.cdx.json"
          for lock in requirements-lock requirements-build-lock; do
            uv tool run --from cyclonedx-bom==7.4.0 cyclonedx-py requirements "raspberry-pi/$lock.txt" --output-format JSON --output-file "$RUNNER_TEMP/sbom/pi-$lock.cdx.json"
          done
          uv tool run --from cyclonedx-bom==7.4.0 cyclonedx-py requirements deploy/simulation-vercel/requirements-lock.txt --output-format JSON --output-file "$RUNNER_TEMP/sbom/simulation-requirements-lock.cdx.json"
      - name: Keep the bill of materials
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          retention-days: 90
          if-no-files-found: error
          overwrite: true
          path: ${{ runner.temp }}/sbom
      # Only the JUnit files of the two test files above: how many tests they
      # hold and whether they pass. Nothing of what the audits or the scan
      # found leaves this job.
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-scripts-audit
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # `jobSummary: false`: the report of the link checker is printed in the log
      # of this step, whole, whatever this setting. Written to the summary of
      # the run as well, it stood as one more block above the quality report,
      # with a notice pointing at it.
      - name: Check local Markdown links and anchors
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          lycheeVersion: v0.23.0
          args: --offline --include-fragments --no-progress 'README.md' 'docs/**/*.md'
          token: ''
          jobSummary: false
      # Part of the gate: the tests of what decides the gates themselves (the
      # path rule, this workflow, the analysis and deployment workflows, the
      # release pipeline, the quality report, the exceptions of the dependency
      # audit and what Dependabot watches). In this job because it is a required check that runs
      # on every event, whatever the files changed: a workflow test that fails
      # blocks the merge. They install nothing and read the files as text.
      - name: Test the path rule, the workflows and the quality report
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-ci.xml" scripts/ci/gates-for-changes.test.mjs scripts/ci/ci-workflow.test.mjs scripts/ci/analysis-workflows.test.mjs scripts/ci/deploy-workflows.test.mjs scripts/ci/release-workflow.test.mjs scripts/ci/quality-report.test.mjs scripts/ci/dependency-audit.test.mjs scripts/ci/convex-generated-api.test.mjs
      - name: Resolve threat identifiers
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-men.xml" scripts/ci/check-men.test.mjs
          bash scripts/ci/check-men.sh
      # Part of the gate: the release tooling (scripts/release.sh) and what
      # docs/release.md and the release template say of it. It is the test
      # file of `npm run test:release`, run directly so that it can be told
      # where to keep its JUnit file. Every test works in throwaway
      # repositories with a double of `gh`: nothing reaches GitHub, nothing is
      # tagged, pushed or deployed. In this job because it runs on every
      # event, whatever the files changed: these tests read pages of docs/,
      # which the path rule lets the other gates skip.
      - name: Test the release tooling
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-release.xml" scripts/release.test.mjs
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-scripts-docs
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality
      # Part of the gate, last because it is the only step that installs
      # anything: the test that reads every text file of the repository, of
      # every kind (lib/legacyModeReferences.test.ts). `web` runs it with the
      # tests of lib/, and the path rule skips `web` on a pull request that
      # changes only documentation or Python: there a retired name could come
      # back unseen until the push to develop. Here it runs on every event.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ !cancelled() }}
        with:
          node-version: '24'
          cache: npm
      - name: Install what the test of the whole repository runs with
        if: ${{ !cancelled() }}
        run: npm ci
      - name: Test what is read across the whole repository
        if: ${{ !cancelled() }}
        run: npm run test:lib -- lib/legacyModeReferences.test.ts
