name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The simulation battery is cut into this many shares. The matrix of
  # `simulation-battery` must name each of them once (0 to this number minus
  # one): `simulation-gate` fails if a share is missing or if a test ran twice.
  SIMULATION_SHARES: '13'
  # For the quality report (see `quality-report` below): what makes
  # `node --test` and vitest keep a JUnit file next to their usual output.
  # Where the file goes follows on each line that uses them.
  NODE_TEST_REPORT: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
  VITEST_REPORT: --reporter=default --reporter=github-actions --reporter=junit

# Which gates run (docs/framework-de-test.md, section CI).
#
# `changes` reads the files a pull request changes (scripts/ci/gates-for-changes.mjs).
# The jobs that depend on it carry the same condition: they are skipped only
# on a pull request, and only when `changes` answered an explicit 'false'.
# A push, the nightly run, a manual run, a `changes` job that failed or said
# nothing: every gate runs. `!cancelled()` is what lets a gate run when
# `changes` failed; without it GitHub would skip the gate and report the
# required check as passed. `docs` and `audit` never depend on `changes`.
#
# `simulation-gate` says `always()` where the others say `!cancelled()`: it
# waits for other jobs, so a run cancelled while they work would otherwise
# skip it, and a skipped job passes a required check. It starts instead, and
# fails because a part did not succeed. The others do not wait for the work
# of another job: cancelled while they run, they report "cancelled". Only a
# run cancelled during the few seconds of `changes` leaves them skipped.
#
# The names `pi-gate`, `simulation-gate`, `convex-tests`, `web`, `audit` and
# `docs` are required by branch protection: each must stay the name of one
# job, never of a matrix (a skipped matrix job reports under another name).
#
# The quality report (docs/framework-de-test.md, "Rapport de qualité") adds to
# the gates without deciding any: the test runners keep a JUnit file, the gate
# scripts say how each stage ended, and the steps named "Quality report" and
# "Keep the numbers for the quality report" read and publish that. Each of
# those steps carries `continue-on-error: true`: none can turn a gate red.
# `quality-report`, the last job, is not a required check, and no step of it
# can fail it.
#
# The coverage of Convex and of the site is another matter: it is part of
# their gates (docs/framework-de-test.md, "Seuils de couverture de Convex et
# du site"). The steps named "Enforce the coverage" of `convex-tests` and of
# `web` fail under the threshold written in scripts/ci/coverage-thresholds.mjs
# and carry no `continue-on-error`. The report reads the measure they leave.

jobs:
  # The table of the run, one line per project, written on the page of the
  # run. It waits for every gate and runs whatever happened to them
  # (`always()`): a gate that failed, was skipped by the path rule or was
  # cancelled is a line of the table, not a reason to have no table. Every
  # step continues on error: the worst a step can do is leave the summary
  # saying "rapport indisponible". What is left that can end this job other
  # than green is not a step: its time limit, a runner that fails, a run that
  # is cancelled. No required check depends on it; scripts/release.sh, which
  # reads every check of a commit, would then ask for a rerun. It reads how
  # each job ended from `needs`, the answer of the path rule included, so that
  # the rule is still read in one place only.
  quality-report:
    needs: [changes, pi-gate, simulation-gate, convex-tests, web, audit, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Gather the numbers every job left
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: quality-*
          path: ${{ runner.temp }}/quality
      - name: Quality report of the run
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # GitHub anchors the summary of a job at this number: the notice the
          # report emits ends on the address of the table.
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: node scripts/ci/quality-report.mjs report --artifacts "$RUNNER_TEMP/quality" --out "$RUNNER_TEMP/quality-report"
      # Should the script itself be missing or unable to start.
      - name: Say so when no report was written
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ ! -s "$RUNNER_TEMP/quality-report/quality-report.json" ]]; then
            echo '**Rapport de qualité : rapport indisponible.** Aucune gate ne dépend de lui.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish quality-report.json
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-report
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality-report

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.rule.outputs.python }}
      node: ${{ steps.rule.outputs.node }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      # Where `node --test` is told, below, to keep its JUnit file.
      - name: Make room for the numbers of the quality report
        run: mkdir -p "$RUNNER_TEMP/quality"
      - name: Test the path rule, the workflows and the quality report
        run: node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-ci.xml" scripts/ci/gates-for-changes.test.mjs scripts/ci/ci-workflow.test.mjs scripts/ci/analysis-workflows.test.mjs scripts/ci/deploy-workflows.test.mjs scripts/ci/quality-report.test.mjs scripts/ci/convex-generated-api.test.mjs
      - name: Decide which gates this run needs
        id: rule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          changed="$RUNNER_TEMP/changed-paths"
          : > "$changed"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # The checkout is the merge of the pull request into its base
            # branch: its first parent is the base, its second the pull request.
            # Renames are listed under both names, removals like any change.
            git rev-parse --verify --quiet 'HEAD^2' > /dev/null
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$changed"
          fi
          node scripts/ci/gates-for-changes.mjs --event "$EVENT_NAME" < "$changed" | tee -a "$GITHUB_OUTPUT"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-scripts-changes
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  pi-gate:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          lfs: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: pi-gate
      - name: Install Python dependencies
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python -r raspberry-pi/requirements-dev.txt
          uv pip install --python raspberry-pi/.venv/bin/python --no-deps bitalino==1.2.6
      - name: Pi gate
        env:
          PYTEST_ADDOPTS: --durations=25
          QUALITY_REPORT_DIR: ${{ runner.temp }}/quality
        run: |
          echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          PI_GATE_PROCESSES="$(nproc)" bash raspberry-pi/scripts/check.sh
      # The nightly run only: a simulated day of sessions with the session
      # record written, heap, object count and tick cost judged per session
      # (raspberry-pi/tests/test_record_endurance.py). The same loop runs for
      # a few simulated minutes in the gate above, on every run.
      - name: Pi endurance, a simulated day of sessions with the session record written
        if: ${{ github.event_name == 'schedule' }}
        timeout-minutes: 35
        working-directory: raspberry-pi
        env:
          ANHEART_ENDURANCE_HOURS: '24'
        run: .venv/bin/python -m pytest tests/test_record_endurance.py -m slow -s
      # The same list of paths in `pi-gate` and in `simulation-gate`, as when
      # one job published both: it is what keeps each file under its full
      # path inside the artifact (raspberry-pi/coverage.xml, simulation/...).
      - name: Publish coverage and synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pi-gate-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            raspberry-pi/coverage.xml
            simulation/coverage.xml
            simulation/out/ci/report.json
            simulation/out/ci/report.html
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/ci/quality-report.mjs job pi --dir "$RUNNER_TEMP/quality" --shares "$(nproc)"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-pi
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  # The scenario battery of the simulation gate, cut into SIMULATION_SHARES
  # shares, one pytest process each. Share 0 is the cohort, which uses every
  # CPU by itself: it has a runner of its own. `simulation-gate` judges them.
  simulation-battery:
    name: simulation (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: cohort
            shares: 0-0
          - part: battery 1
            shares: 1-4
          - part: battery 2
            shares: 5-8
          - part: battery 3
            shares: 9-12
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          lfs: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: simulation-gate
      - name: Install Python dependencies
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python -r raspberry-pi/requirements-dev.txt
          uv pip install --python raspberry-pi/.venv/bin/python --no-deps bitalino==1.2.6
      # In every part: the test of the CAD extraction is skipped without it,
      # and no part knows in advance which one will be given that test.
      - name: Install and verify CAD extractor
        run: |
          uv venv simulation/cad/.venv-cad
          uv pip install --python simulation/cad/.venv-cad/bin/python -r simulation/cad/requirements.txt
          simulation/cad/.venv-cad/bin/python simulation/cad/extract_geometry.py CAO/Gaura_Assy_2907.STEP "$RUNNER_TEMP/cad-preflight.json"
      - name: Simulation gate, shares ${{ matrix.shares }} of the battery
        env:
          PYTEST_ADDOPTS: --durations=15
          SIMULATION_GATE_SHARES: ${{ matrix.shares }}/${{ env.SIMULATION_SHARES }}
          SIMULATION_GATE_EVIDENCE: ${{ runner.temp }}/simulation-evidence
          # Inside the evidence, so that it reaches `simulation-gate` with it.
          QUALITY_REPORT_DIR: ${{ runner.temp }}/simulation-evidence/quality-${{ matrix.shares }}
        run: |
          echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          bash simulation/scripts/check.sh
      # One artifact per part, replaced when the part is run again: the gate
      # must judge the latest run of each part, never two runs of the same one.
      - name: Keep what these shares recorded and measured
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simulation-evidence-${{ matrix.shares }}
          retention-days: 14
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
          path: ${{ runner.temp }}/simulation-evidence

  simulation-report:
    name: simulation (report)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: simulation-gate
      - name: Install Python dependencies
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python -r raspberry-pi/requirements-dev.txt
          uv pip install --python raspberry-pi/.venv/bin/python --no-deps bitalino==1.2.6
      - name: Synthetic simulation report
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--all --workers 2 --out simulation/out/ci)
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--dsp)
          fi
          raspberry-pi/.venv/bin/python -m simulation.quick "${args[@]}"
      - name: Keep the synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simulation-report
          retention-days: 14
          if-no-files-found: error
          overwrite: true
          path: |
            simulation/out/ci/report.json
            simulation/out/ci/report.html

  # The required check. It passes only if every part above succeeded AND the
  # records they left prove that every test of the battery ran exactly once,
  # with 100 % of branches covered once their measures are merged.
  simulation-gate:
    needs: [changes, simulation-battery, simulation-report]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:raspberry-pi
    steps:
      # Runs whatever happened to the run, cancelled included: a part that was
      # cancelled, that failed, that ran out of time or that was skipped when
      # it should not have been must leave this required check failed.
      - name: Every part of the gate succeeded
        if: ${{ always() }}
        env:
          BATTERY: ${{ needs.simulation-battery.result }}
          REPORT: ${{ needs.simulation-report.result }}
        run: |
          echo "simulation battery (all parts): $BATTERY"
          echo "simulation report: $REPORT"
          [[ "$BATTERY" == success && "$REPORT" == success ]]
      # The steps below run even when a part failed: what did run is still
      # judged and shown, and the job stays failed because of the step above.
      # They do not run when the run was cancelled.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: ${{ !cancelled() }}
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: simulation-gate
      - name: Install Python dependencies
        if: ${{ !cancelled() }}
        run: |
          uv venv raspberry-pi/.venv
          uv pip install --python raspberry-pi/.venv/bin/python -r raspberry-pi/requirements-dev.txt
          uv pip install --python raspberry-pi/.venv/bin/python --no-deps bitalino==1.2.6
      - name: Gather what every share recorded and measured
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: simulation-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/simulation-evidence
      - name: Gather the synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: simulation-report
          path: simulation/out/ci
      - name: Simulation gate, every test once and combined coverage
        if: ${{ !cancelled() }}
        env:
          SIMULATION_GATE_COMBINE: ${{ env.SIMULATION_SHARES }}
          SIMULATION_GATE_EVIDENCE: ${{ runner.temp }}/simulation-evidence
          QUALITY_REPORT_DIR: ${{ runner.temp }}/quality
        run: bash simulation/scripts/check.sh
      - name: Publish coverage and synthetic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simulation-gate-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            raspberry-pi/coverage.xml
            simulation/coverage.xml
            simulation/out/ci/report.json
            simulation/out/ci/report.html
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/ci/quality-report.mjs job simulation --dir "$RUNNER_TEMP/quality" --parts "$RUNNER_TEMP/simulation-evidence" --scenarios simulation/out/ci/report.json --shares "$SIMULATION_SHARES"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-simulation
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  convex-tests:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.node != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Part of the gate: convex/_generated/api.d.ts, which is committed, must
      # be what the files of convex/ imply (scripts/ci/convex-generated-api.mjs).
      # The command of the package that writes it needs a deployment, and this
      # workflow has none and reaches none: the script derives the file from
      # the tree. Before the type-check, which a stale file would otherwise
      # fail without saying why, or not fail at all.
      - name: Check the committed bindings of the Convex functions
        run: node scripts/ci/convex-generated-api.mjs
      - name: Type-check the Convex functions
        id: types
        run: npx tsc -p convex/tsconfig.json --noEmit
      - run: npm run test:convex -- $VITEST_REPORT --outputFile.junit="$RUNNER_TEMP/quality/convex.xml"
      # Part of the gate: the same tests once more, measured this time. The
      # command fails under 80 % of lines or of branches, on `convex/` as a
      # whole or on one of the three files of the safety chain taken alone
      # (scripts/ci/coverage-thresholds.mjs). It runs even when a test above
      # failed, so that the quality report still has its measure.
      - name: Enforce the coverage of the Convex functions
        if: ${{ !cancelled() }}
        run: npm run coverage:convex -- --reporter=default --coverage.reportsDirectory="$RUNNER_TEMP/quality/coverage-convex"
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TYPES_OUTCOME: ${{ steps.types.outcome }}
        run: node scripts/ci/quality-report.mjs job convex --dir "$RUNNER_TEMP/quality"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-convex
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  web:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.node != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CONVEX_URL: https://ci-fixture.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: types
        run: npx tsc --noEmit
      - id: lint
        run: npm run lint
      - name: Test the local panel of the console
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/pi-panel.xml" raspberry-pi/tests/web/*.test.mjs
      - run: npm run test:ecg -- $VITEST_REPORT --outputFile.junit="$RUNNER_TEMP/quality/site-lib.xml"
      - run: npm run test:site -- $VITEST_REPORT --outputFile.junit="$RUNNER_TEMP/quality/site-components.xml"
      - run: npm run build
      # Part of the gate: every test of the site once more, in one run,
      # measured this time. The command fails under 80 % of lines or of
      # branches on the measured folders of the site
      # (scripts/ci/coverage-thresholds.mjs). It runs even when a step above
      # failed, so that the quality report still has its measure.
      - name: Enforce the coverage of the site
        if: ${{ !cancelled() }}
        run: npm run coverage:site -- --reporter=default --coverage.reportsDirectory="$RUNNER_TEMP/quality/coverage-site"
      - name: Quality report, the numbers of this job
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: node scripts/ci/quality-report.mjs job site --dir "$RUNNER_TEMP/quality"
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-site
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: true
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      # The test file of `npm run test:dependency-security`, run directly so
      # that it can be told where to keep its JUnit file.
      - name: Verify dependency stack-depth guards
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-dependency-guard.xml" scripts/ci/braces-depth-guard.test.mjs
      - name: Audit Python dependencies
        if: ${{ !cancelled() }}
        run: |
          uv pip compile raspberry-pi/requirements-dev.txt requirements.txt --python-version 3.12 --generate-hashes --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv tool run pip-audit==2.9.0 --disable-pip --require-hashes -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Scan all Git history
        if: ${{ !cancelled() }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          anheart_gitleaks_bin="$(go env GOPATH)/bin/gitleaks"
          mkdir -p "$RUNNER_TEMP/quality"
          ANHEART_GITLEAKS_BIN="$anheart_gitleaks_bin" node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-gitleaks-fixture.xml" scripts/ci/gitleaks-fixture.test.mjs
          "$anheart_gitleaks_bin" git --redact --log-opts='--all'
      # Only the JUnit files of the two test files above: how many tests they
      # hold and whether they pass. Nothing of what the audits or the scan
      # found leaves this job.
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-scripts-audit
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # `jobSummary: false`: the report of the link checker is printed in the log
      # of this step, whole, whatever this setting. Written to the summary of
      # the run as well, it stood as one more block above the quality report,
      # with a notice pointing at it.
      - name: Check local Markdown links and anchors
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          lycheeVersion: v0.23.0
          args: --offline --include-fragments --no-progress 'README.md' 'docs/**/*.md'
          token: ''
          jobSummary: false
      - name: Resolve threat identifiers
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-men.xml" scripts/ci/check-men.test.mjs
          bash scripts/ci/check-men.sh
      # Part of the gate: the release tooling (scripts/release.sh) and what
      # docs/release.md and the release template say of it. It is the test
      # file of `npm run test:release`, run directly so that it can be told
      # where to keep its JUnit file. Every test works in throwaway
      # repositories with a double of `gh`: nothing reaches GitHub, nothing is
      # tagged, pushed or deployed. In this job because it runs on every
      # event, whatever the files changed: these tests read pages of docs/,
      # which the path rule lets the other gates skip.
      - name: Test the release tooling
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality"
          node --test $NODE_TEST_REPORT --test-reporter-destination="$RUNNER_TEMP/quality/scripts-release.xml" scripts/release.test.mjs
      - name: Keep the numbers for the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-scripts-docs
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
          path: ${{ runner.temp }}/quality
