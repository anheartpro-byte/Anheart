name: SonarQube Cloud

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# One analysis at a time per pull request: a new push replaces the one in
# progress. A push to develop or main and a manual run are keyed by their
# commit, so that a later push never cancels them.
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Quality and security analysis by SonarQube Cloud (docs/framework-de-test.md,
# section CI, "Analyse statique externe"). What is analysed, and the keys of
# the organization and of the project, are in sonar-project.properties.
#
# Not a gate. No job below is a required check, and none may take the name of
# a job of ci.yml. The analysis does not wait for the quality gate of
# SonarQube Cloud: the `sonar` job fails only if the analysis itself fails.
#
# The analysis needs the secret SONAR_TOKEN. A job cannot read a secret in
# its own `if`: `sonar-config` reads it in the environment of one step and
# says only whether it is there. Without the token (the secret does not exist
# yet, or the pull request comes from a fork, which is given no secret),
# `sonar` is skipped and nothing fails.

jobs:
  sonar-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      token: ${{ steps.token.outputs.present }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Test the analysis workflows and the SonarQube Cloud configuration
        run: node --test scripts/ci/analysis-workflows.test.mjs
      # The only step of this job that is given the token. It runs the lines
      # below and nothing of the repository, and prints nothing of the token.
      - name: Say whether this run was given the SonarQube Cloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'SONAR_TOKEN is set: the analysis may run.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'SONAR_TOKEN is not set for this run: the SonarQube Cloud analysis is skipped and nothing fails (docs/framework-de-test.md, section CI).' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  sonar:
    needs: sonar-config
    if: ${{ needs.sonar-config.outputs.token == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history: SonarQube Cloud dates each line from it to tell new
      # code from old code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Analyze and send the results to SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
