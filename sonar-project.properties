# SonarQube Cloud: what the `sonar` job of .github/workflows/sonar.yml sends
# for analysis. Explained in docs/framework-de-test.md, section CI, "Analyse
# statique externe". Checked by scripts/ci/analysis-workflows.test.mjs.

# ---------------------------------------------------------------------------
# The organization and the project on SonarQube Cloud.
#
# DEFAULTS, written before the project existed there. They must be exactly
# the two keys SonarQube Cloud shows for the project. If it shows others,
# change them here: this file is the only place where they are written.
# ---------------------------------------------------------------------------
sonar.organization=anheartpro-byte
sonar.projectKey=anheartpro-byte_Anheart

sonar.python.version=3.12

# ---------------------------------------------------------------------------
# Scope. Everything in the repository is analysed unless a line below says
# otherwise: a new directory is analysed without having to be listed here.
# ---------------------------------------------------------------------------
sonar.sources=.
sonar.tests=.

# Test code, judged with the rules for tests and not counted as source: the
# pytest suites of the Pi, of the simulation and of the hosted simulation, the
# tests of the gate helpers, the Vitest and `node --test` files that sit next
# to what they test, and the fixtures the Convex tests share.
sonar.test.inclusions=\
  **/tests/**,\
  scripts/ci/test_*.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  convex/test.setup.ts,\
  convex/**/*.fixtures.ts

# Not analysed as source.
#   - generated or installed, not written here: the Convex bindings, the
#     dependencies, the virtual environments, the build outputs, the reports
#     the simulation writes, the two lockfiles;
#   - not code: the CAD assembly, the screenshots of the guides, raw capture
#     dumps, the recordings of real sessions replayed by the simulation;
#   - the test code declared above, named a second time on purpose: a file is
#     either source or test, and an analysis that found one in both would fail.
sonar.exclusions=\
  convex/_generated/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/.venv-*/**,\
  **/venv/**,\
  .next/**,\
  out/**,\
  build/**,\
  simulation/out/**,\
  package-lock.json,\
  bun.lock,\
  CAO/**,\
  docs/**/img/**,\
  **/SESSION_*.txt,\
  **/Session_data.txt,\
  simulation/scenarios/real/**,\
  **/tests/**,\
  scripts/ci/test_*.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  convex/test.setup.ts,\
  convex/**/*.fixtures.ts

# ---------------------------------------------------------------------------
# Coverage: none is sent to SonarQube Cloud yet, so no file is counted for it.
#
# Without this line every file would be shown as covered at 0 %, which is
# false, and the quality gate of SonarQube Cloud would judge new code on that
# figure. The real measure stays where it is made and enforced: `pi-gate` and
# `simulation-gate` (100 % of branches on the safety chain). Remove this line
# in the change that imports their reports (sonar.python.coverage.reportPaths),
# not before.
# ---------------------------------------------------------------------------
sonar.coverage.exclusions=**/*
